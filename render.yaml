# ReCircuit — Render blueprint (Dashboard → New → Blueprint, point at repo).
# Creates a free web service + free PostgreSQL, wired via DATABASE_URL.
# No local data is migrated automatically; production starts with an empty DB.
services:
  - type: web
    name: recircuit
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --log-file -
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: DJANGO_DEBUG
        value: False
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: recircuit-db
          property: connectionString

databases:
  - name: recircuit-db
    plan: free
