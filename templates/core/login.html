{% extends "base.html" %}
{% block title %}Login — ReCircuit{% endblock %}
{% block content %}
<section class="section">
  <div class="container narrow">
    <h2>Welcome back</h2>
    <p class="muted">Login to access your protected dashboard.</p>
    <form method="post" class="card form">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ request.GET.next|default:'' }}" />
      {% if form.non_field_errors %}<div class="form-errors">{{ form.non_field_errors }}</div>{% endif %}
      <label>Username {{ form.username }}</label>
      <label>Password {{ form.password }}</label>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
      <p class="muted small">No account? <a href="{% url 'register' %}">Register</a></p>
    </form>
  </div>
</section>
{% endblock %}
